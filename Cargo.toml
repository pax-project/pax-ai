[package]
name = "pax-ai"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
name = "pax_ai"
path = "src/lib.rs"

[[bin]]
name = "pax-mcp"
path = "src/bin/pax-mcp/main.rs"
required-features = ["mcp"]

[features]
default = ["mcp"]
# The MCP server (`pax_ai::mcp` + the `pax-mcp` binary). Off for library
# consumers like lazy-pax, so they don't pull in the MCP SDK or tokio's
# multi-threaded runtime.
mcp = [
    "dep:rmcp",
    "dep:schemars",
    "pax-core/schemars",
    "tokio/macros",
    "tokio/rt-multi-thread",
    "tokio/io-std",
]

[dependencies]
pax-core = { package = "pax-core-papers", version = "3.3.1", default-features = false }
reqwest = { version = "0.12", features = ["json"] }
rmcp = { version = "3.9", features = ["server", "macros", "transport-io"], optional = true }
schemars = { version = "1.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2.0.20"
# The index runs `nix` and `pdftotext` on tokio's blocking pool, with a
# timeout. reqwest already depends on tokio, so this adds no crate.
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
