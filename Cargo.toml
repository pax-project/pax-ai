[package]
name = "pax-ai"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
name = "pax_ai"
path = "src/lib.rs"

[dependencies]
pax-core = { git = "https://github.com/pax-project/pax-core.git", tag = "1.1.0", version = "1.1.0", default-features = false }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
